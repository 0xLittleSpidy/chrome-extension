<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <div class="logo-icon">
          <span class="logo-letter">H</span>
        </div>
        <div class="header-titles">
          <h1 class="title">Helper</h1>
          <p class="subtitle">Productivity & Text Assistant</p>
        </div>
      </div>
      <div class="header-actions">
        <div id="site-status-badge" class="status-badge badge-inactive">
          <span class="status-dot"></span>
          <span id="site-status-text">Inactive</span>
        </div>
        <button id="open-settings-btn" class="icon-btn-settings" title="Settings" aria-label="Open Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Current Site Card -->
    <section class="card current-site-card">
      <div class="card-header">
        <span class="section-label">Current Website</span>
        <span id="current-site-host" class="current-host-name">Detecting...</span>
      </div>
      <div class="current-site-actions">
        <button id="toggle-current-site-btn" class="btn btn-primary">
          <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z" clip-rule="evenodd" />
          </svg>
          <span id="toggle-current-site-label">Add to Whitelist</span>
        </button>
      </div>
      <div id="add-feedback" class="feedback-msg"></div>

      <!-- Active Site Switches (Shown when current site is whitelisted) -->
      <div id="active-site-switches" class="active-site-switches" style="display: none;">
        <div class="switch-row">
          <div class="switch-info">
            <span class="switch-title">Replacer on this site</span>
            <span class="switch-desc">Enable or pause word replacements</span>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-site-replacer" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="switch-row">
          <div class="switch-info">
            <span class="switch-title">Storage on this site</span>
            <span class="switch-desc">Enable snippet context menu integration</span>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-site-storage" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </section>

    <!-- Saved Snippets Quick Copy Section -->
    <section class="card snippets-quick-card">
      <div class="card-header-flex">
        <span class="section-label">Saved Snippets</span>
        <span id="popup-snippets-count" class="badge">0</span>
      </div>
      <div id="popup-snippets-list" class="popup-snippets-list">
        <!-- Rendered dynamically -->
      </div>
      <div id="popup-snippets-empty" class="popup-snippets-empty" style="display: none;">
        <p class="empty-desc">No snippets saved yet. Add snippets in Settings.</p>
      </div>
    </section>
  </div>

  <script src="../lib/allowlist-utils.js"></script>
  <script src="../lib/storage-manager.js"></script>
  <script src="popup.js"></script>
</body>
</html>
